<main>
  <h1>Conciliador de facturas y retenciones</h1>

  <label>
    Archivo de facturas
    <input type="file" accept=".csv" (change)="seleccionarFacturas($event)" />
  </label>

  <label>
    Archivo de contabilidad
    <input type="file" accept=".csv" (change)="seleccionarContabilidad($event)" />
  </label>

  <button (click)="procesar()" [disabled]="cargando()">
    {{ cargando() ? 'Procesando...' : 'Procesar' }}
  </button>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (resultado(); as r) {
    <p>Facturas leídas: {{ r.facturas_leidas }}</p>
    <p>Registros contables leídos: {{ r.registros_contables_leidos }}</p>
  }
</main>
